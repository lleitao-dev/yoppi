services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yoppi
      POSTGRES_USER: yoppi
      POSTGRES_PASSWORD: yoppi_dev
    # ports:
    #  - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yoppi -d yoppi']
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: development
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://yoppi:yoppi_dev@postgres:5432/yoppi
      SERVER_PORT: 4000
      WEB_ORIGIN: http://localhost:3000
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/v1/ready').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - '3000:3000'
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data:
