services:
  server:
    build:
      target: production
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      TRUST_PROXY: 'true'
    restart: unless-stopped

  web:
    build:
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    environment:
      NODE_ENV: production
    restart: unless-stopped
