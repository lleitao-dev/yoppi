name: yoppi

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '5'

services:
  server:
    image: ${YOPPI_REGISTRY:?Set YOPPI_REGISTRY}/yoppi-server:${YOPPI_VERSION:?Set YOPPI_VERSION}
    init: true
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      SERVER_PORT: 4000
      WEB_ORIGIN: https://${YOPPI_DOMAIN:?Set YOPPI_DOMAIN}
      TRUST_PROXY: 'true'
    expose:
      - '4000'
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/v1/ready').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    image: ${YOPPI_REGISTRY:?Set YOPPI_REGISTRY}/yoppi-web:${YOPPI_VERSION:?Set YOPPI_VERSION}
    init: true
    environment:
      NODE_ENV: production
    expose:
      - '3000'
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    environment:
      YOPPI_DOMAIN: ${YOPPI_DOMAIN:?Set YOPPI_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
